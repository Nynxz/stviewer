[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
stv-core = { path = "crates/core" }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
